[package]
name = "gd-rl-client"
version = "0.1.0"
edition = "2024"

[dependencies]
modurl = "0.1"
modurl_gym = "0.1"
burn = { version = "=0.22.0", default-features = false, features = ["std", "flex", "autodiff", "ndarray", "optim"] }
candle-core = "0.11.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"