name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:

jobs:
  mod-windows:
    name: Geode mod (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v6.0.0-alpha.1
          bindings: geode-sdk/bindings
          bindings-ref: main        # VERIFY: must be the ref that has 2.2091 bindings
          combine: true

  package:
    name: Package mod
    runs-on: ubuntu-latest
    needs: [mod-windows]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: gd-rl-env-geode
          path: ${{ steps.build.outputs.build-output }}

  trainer:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  trainer-windows-release:
    name: Rust trainer .exe (Windows)
    needs: [trainer]
    runs-on: windows-latest
    env:
      # AVX2/FMA build for faster matmuls. Remove this line if your CPU is older than ~2015.
      RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gd-trainer
      - uses: actions/upload-artifact@v4
        with:
          name: gd-trainer-windows
          path: target/release/gd-trainer.exe

